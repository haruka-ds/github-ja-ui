<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub JA UI</title>
    <style>
      body {
        width: 230px;
        margin: 0;
        padding: 16px;
        font:
          14px system-ui,
          sans-serif;
        color: #24292f;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      p {
        color: #57606a;
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1>GitHub JA UI</h1>
    <label><input id="enabled" type="checkbox" /> 日本語の操作案内を使う</label>
    <p>GitHub の画面だけに適用されます。</p>
    <script src="popup.js"></script>
  </body>
</html>
